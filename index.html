<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arbiter</title>
<style>
body { font-family: -apple-system; margin:0; display:flex; height:100vh; }
.sidebar { width:260px; border-right:1px solid #eee; overflow:auto; }
.chat-item { padding:10px; cursor:pointer; }
.chat-item.active { background:#e6f0ff; }
.main { flex:1; display:flex; flex-direction:column; }
.messages { flex:1; padding:16px; overflow:auto; }
.input { display:flex; border-top:1px solid #eee; }
input { flex:1; padding:10px; border:none; outline:none; }
button { padding:10px; }
</style>
</head>
<body>

<div class="sidebar" id="chatList"></div>

<div class="main">
  <div class="messages" id="messages"></div>
  <div class="input">
    <input id="input" placeholder="Ask something..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
let state = {
  chats: {},
  current: null,
  webSearch: true
};

function newChat() {
  const id = Date.now().toString();
  state.chats[id] = { id, messages: [] };
  state.current = id;
}

function renderChats() {
  const el = document.getElementById("chatList");
  el.innerHTML = "";
  Object.values(state.chats).forEach(c => {
    const div = document.createElement("div");
    div.className = "chat-item";
    if (c.id === state.current) div.classList.add("active");
    div.innerText = "Chat " + c.id.slice(-4);
    div.onclick = () => {
      state.current = c.id;
      renderChats();
      renderMessages();
    };
    el.appendChild(div);
  });
}

function renderMessages() {
  const el = document.getElementById("messages");
  el.innerHTML = "";
  const chat = state.chats[state.current];
  chat.messages.forEach(m => {
    const div = document.createElement("div");
    div.innerText = m.role + ": " + m.content;
    el.appendChild(div);
  });
}

function shouldSearch(text) {
  return /today|latest|news|current/.test(text.toLowerCase());
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value;
  input.value = "";

  const chat = state.chats[state.current];
  chat.messages.push({ role:"user", content:text });

  renderMessages();

  const msgs = chat.messages.map(m => ({
    role: m.role,
    content: m.content
  }));

  const useSearch = state.webSearch && shouldSearch(text);

  const payload = {
    model: "openai/gpt-4o",
    messages: msgs
  };

  if (useSearch) {
    payload.tools = [{ type: "openrouter:web_search" }];
    payload.tool_choice = { type: "openrouter:web_search" };
  }

  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method:"POST",
    headers:{
      "Authorization":"Bearer YOUR_KEY",
      "Content-Type":"application/json"
    },
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  const reply = data.choices?.[0]?.message?.content || "Error";

  chat.messages.push({ role:"assistant", content:reply });
  renderMessages();
}

newChat();
renderChats();
renderMessages();
</script>

</body>
</html>
